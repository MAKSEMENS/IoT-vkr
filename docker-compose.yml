version: "3.9"

services:

  # ── Infrastructure ────────────────────────────────────────────────────────

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic sensor-raw-events --partitions 4 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic room-state-events --partitions 4 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic alert-events      --partitions 4 --replication-factor 1
      "

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: iot_monitoring
      POSTGRES_USER: vkr
      POSTGRES_PASSWORD: vkr_secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vkr -d iot_monitoring"]
      interval: 5s
      retries: 10

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - postgres

  # ── Application services ──────────────────────────────────────────────────

  event-ingestion:
    build: ./event-ingestion-service
    ports:
      - "8081:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  state-aggregation:
    build: ./state-aggregation-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iot_monitoring
      SPRING_DATASOURCE_USERNAME: vkr
      SPRING_DATASOURCE_PASSWORD: vkr_secret
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  anomaly-detection:
    build: ./anomaly-detection-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iot_monitoring
      SPRING_DATASOURCE_USERNAME: vkr
      SPRING_DATASOURCE_PASSWORD: vkr_secret
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  query-service:
    build: ./query-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iot_monitoring
      SPRING_DATASOURCE_USERNAME: vkr
      SPRING_DATASOURCE_PASSWORD: vkr_secret
    depends_on:
      postgres:
        condition: service_healthy

  iot-simulator:
    build: ./iot-simulator
    environment:
      SIMULATOR_TARGET_URL: http://event-ingestion:8080/events
      SIMULATOR_EVENTS_PER_SECOND: "50"
    depends_on:
      - event-ingestion
    profiles:
      - simulator

volumes:
  kafka-data:
  postgres-data:
  grafana-data:

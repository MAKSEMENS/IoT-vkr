# Загрузчик дашбордов из файлов этого каталога (ADR-005).
apiVersion: 1

providers:
  - name: vkr-dashboards
    orgId: 1
    folder: 'IoT Monitoring'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false

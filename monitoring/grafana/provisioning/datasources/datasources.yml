# Datasources Grafana — provisioned, монтируется в контейнер (ADR-005).
# Технический контур — Prometheus, бизнес-контур — PostgreSQL напрямую.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL
    uid: postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: vkr
    database: iot_monitoring
    editable: false
    secureJsonData:
      password: vkr_secret
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false

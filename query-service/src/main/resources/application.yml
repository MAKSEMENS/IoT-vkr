spring:
  application:
    name: query-service
  datasource:
    url: jdbc:postgresql://localhost:5432/iot_monitoring
    username: vkr
    password: vkr_secret
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
